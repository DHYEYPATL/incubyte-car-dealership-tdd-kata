services:
  - type: web
    name: incubyte-car-dealership-tdd-kata
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_SEED
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,https://incubyte-car-dealership-tdd-kata.vercel.app"

